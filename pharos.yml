x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"
      tag: '{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}'

services:
  init:
    restart: "no"
    build:
      context: ./init
      dockerfile: Dockerfile
      args:
        - DOCKER_TAG=${NODE_DOCKER_TAG}
        - DOCKER_REPO=${NODE_DOCKER_REPO}
    image: init:pharos
    pull_policy: never
    environment:
      SNAPSHOT: "${SNAPSHOT}"
      GENESIS_URL: "${GENESIS_URL}"
      VERSION_URL: "${VERSION_URL}"
      PHAROS_CONF_URL: "${PHAROS_CONF_URL}"
      CONSENSUS_KEY_PWD: "${CONSENSUS_KEY_PWD}"
      PORTAL_SSL_PWD: "${CONSENSUS_KEY_PWD}"
      # The init container runs the node once to bootstrap keys + base chain
      # data before swapping in the snapshot, so it needs the same config the
      # node entrypoint expects.
      PHAROS_CONF: /data/pharos.conf
      GENESIS_CONF: /data/genesis.conf
      KEYS_DIR: /data/keys
    entrypoint:
      - /usr/local/bin/fetch-snapshot.sh
    volumes:
      - data:/data
      - /etc/localtime:/etc/localtime:ro
    ulimits:
      nofile:
        soft: 10000000
        hard: 10000000
    <<: *logging

  pharos:
    depends_on:
      init:
        condition: service_completed_successfully
    image: ${NODE_DOCKER_REPO}:${NODE_DOCKER_TAG}
    restart: unless-stopped
    environment:
      - CONSENSUS_KEY_PWD=${CONSENSUS_KEY_PWD:-}
      - PHAROS_CONF=/data/pharos.conf
      - GENESIS_CONF=/data/genesis.conf
      - KEYS_DIR=/data/keys
    volumes:
      - data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${P2P_PORT:-19000}:19000/tcp
    ulimits:
      nofile:
        soft: 10000000
        hard: 10000000
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -fsS -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            http://127.0.0.1:18100 | grep -q '"result":"0x688"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true

      # rpc
      - traefik.http.routers.${RPC_HOST:-pharos}.service=${RPC_HOST:-pharos}
      - traefik.http.routers.${RPC_HOST:-pharos}.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST:-pharos}.rule=Host(`${RPC_HOST:-pharos}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST:-pharos}.tls.certresolver=letsencrypt
      - traefik.http.routers.${RPC_HOST:-pharos}lb.service=${RPC_HOST:-pharos}
      - traefik.http.routers.${RPC_HOST:-pharos}lb.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST:-pharos}lb.rule=Host(`${RPC_LB:-pharos-lb}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST:-pharos}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${RPC_HOST:-pharos}.loadbalancer.server.port=${RPC_PORT:-18100}

      # websocket
      - traefik.http.routers.${WS_HOST:-pharosws}.service=${WS_HOST:-pharosws}
      - traefik.http.routers.${WS_HOST:-pharosws}.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-pharosws}.rule=Host(`${WS_HOST:-pharosws}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-pharosws}.tls.certresolver=letsencrypt
      - traefik.http.routers.${WS_HOST:-pharosws}lb.service=${WS_HOST:-pharosws}
      - traefik.http.routers.${WS_HOST:-pharosws}lb.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-pharosws}lb.rule=Host(`${WS_LB:-pharosws-lb}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-pharosws}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${WS_HOST:-pharosws}.loadbalancer.server.port=${WS_PORT:-18200}
    <<: *logging

volumes:
  data: {}
